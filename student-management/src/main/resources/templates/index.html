<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management System</title>

    <style>

        body{
            font-family: Arial;
            margin: 30px;
        }

        input{
            width: 400px;
            padding: 10px;
            margin: 10px 0;
        }

        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        table{
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        table, th, td{
            border: 1px solid gray;
        }

        th, td{
            padding: 10px;
        }

    </style>

</head>
<body>

<h1>Student Management System</h1>

<form th:action="@{/save}" th:object="${student}" method="post">

    <input type="text"
           th:field="*{name}"
           placeholder="Enter Name">

    <br>

    <input type="email"
           th:field="*{email}"
           placeholder="Enter Email">

    <br>

    <input type="text"
           th:field="*{department}"
           placeholder="Enter Department">

    <br><br>

    <button type="submit">
        Save Student
    </button>

</form>

<table>

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="student : ${students}">

        <td th:text="${student.id}"></td>

        <td th:text="${student.name}"></td>

        <td th:text="${student.email}"></td>

        <td th:text="${student.department}"></td>

    </tr>

    </tbody>

</table>

</body>
</html>
